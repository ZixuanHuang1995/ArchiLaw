# One command: docker compose up -d --build
# Postgres holds the corpus, Qdrant holds clause vectors, the API serves
# /query, and Streamlit is the demo UI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: twbc
      POSTGRES_PASSWORD: twbc
      POSTGRES_DB: twbc
    ports:
      - "55432:5432"
    volumes:
      - twbc_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twbc -d twbc"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - twbc_qdrant:/qdrant/storage

  api:
    build: .
    # Reach Postgres and Qdrant through the published host ports. On a healthy
    # Docker bridge, service DNS also works; host-gateway still works there and
    # keeps the demo up when container-to-container forwarding is blocked.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://twbc:twbc@host.docker.internal:55432/twbc
      QDRANT_URL: http://host.docker.internal:6333
      CUDA_VISIBLE_DEVICES: ""
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - "8077:8077"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - hf_cache:/root/.cache/huggingface

  ui:
    build: .
    command: ["streamlit", "run", "twbc_rag/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8571"]
    environment:
      TWBC_API_URL: http://api:8077
    ports:
      - "8571:8571"
    depends_on:
      - api

volumes:
  twbc_pg:
  twbc_qdrant:
  hf_cache:
