[project]
name = "twbc-rag"
version = "0.1.0"
description = "Taiwan building-code corpus ingestion for a citation-first RAG portfolio project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ken" }]
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
twbc = "twbc_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twbc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["twbc_rag", "tests", "dags", "alembic"]
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"twbc_rag/cli.py" = ["B008"]
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E402", "I001"]
